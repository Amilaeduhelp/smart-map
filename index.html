<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eduhelp Smart Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233b; --ink2:#1e3255; --paper:#ece5d3; --paper2:#f7f3e7;
  --line:#d8cdae; --gold:#c9a227; --muted:#6b6455; --danger:#b8322a;
  --shadow:0 12px 34px rgba(15,22,38,.22);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--paper);color:#21201b;overflow:hidden}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{z-index:50;background:linear-gradient(180deg,var(--ink),var(--ink2));border-bottom:1px solid rgba(201,162,39,.4);padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:9px;color:#f3eee0}
.brand strong{font:700 19px 'Spectral',serif;letter-spacing:.02em}.brand small{opacity:.65;font-size:11px}
.controls{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:10px;align-items:center}
.segment{display:flex;background:#10203a;border:1px solid rgba(255,255,255,.12);padding:3px;border-radius:9px;gap:3px}
.segment button{border:0;background:transparent;color:#9ba6b9;height:40px;padding:0 14px;border-radius:7px;font-weight:800;cursor:pointer}
.segment button.active{background:var(--gold);color:#241c05}.segment button:focus-visible,.search-box:focus-visible{outline:3px solid rgba(201,162,39,.55);outline-offset:2px}
.search-wrap{position:relative;min-width:0}.search-box{width:100%;height:46px;border:1px solid rgba(255,255,255,.15);border-radius:9px;background:var(--paper2);padding:0 44px 0 14px;font-size:15px;box-shadow:var(--shadow)}
.clear-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:#ded4b8;cursor:pointer;display:none}.clear-btn.show{display:block}
.suggestions{position:absolute;top:52px;left:0;right:0;max-height:min(52vh,420px);overflow:auto;background:#fffdf6;border:1px solid var(--line);border-radius:9px;box-shadow:0 18px 44px rgba(0,0,0,.32);display:none;z-index:80}.suggestions.open{display:block}
.suggestion{padding:10px 12px;border-bottom:1px solid #e5ddc9;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center}.suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion.active{background:#eee5ce}.swatch{width:10px;height:10px;border-radius:50%}.sugg-main{font:700 15px 'Spectral',serif}.sugg-alt{font-size:11px;color:var(--muted);margin-top:2px}.tag{font-size:9px;font-weight:800;letter-spacing:.05em;background:var(--ink);color:white;padding:4px 6px;border-radius:5px}.empty-sugg{padding:14px;color:var(--muted);font-size:13px}
main{min-height:0;overflow:auto;position:relative;background-image:linear-gradient(rgba(22,35,59,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(22,35,59,.035) 1px,transparent 1px);background-size:28px 28px}.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.welcome{text-align:center;max-width:620px;color:var(--muted)}.welcome h2{font:700 25px 'Spectral',serif;color:#28251e;margin:0 0 8px}.welcome p{line-height:1.65;margin:0}.level-pill{display:inline-block;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:var(--ink);color:#f2e9cf;font-size:11px;font-weight:800}
.map-card{width:min(1500px,96%);background:var(--paper2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(15,22,38,.25)}.map-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}.place-en{font:700 22px 'Spectral',serif}.place-alt{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}.badge{color:white;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.map-viewport{position:relative;min-height:320px;background:#e7dfca;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:crosshair}.map-wrap{position:relative;width:100%;line-height:0}.map-image{display:block;width:100%;height:auto}.mask{position:absolute;left:0;right:0;background:rgba(8,12,22,.52);pointer-events:none}.focus-anchor{position:absolute;left:0;right:0;pointer-events:none}.map-label{position:absolute;right:10px;top:10px;line-height:1.4;background:rgba(22,35,59,.94);color:#fff;padding:7px 9px;border-radius:7px;font-size:11px;pointer-events:none}.fallback{padding:36px 20px;text-align:center;color:var(--muted);line-height:1.6}.tech{padding:9px 15px;background:#e5dcc4;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}.tech b{color:#27231c}
.ripple{position:absolute;width:0;height:0;z-index:15;pointer-events:none}.ripple .core{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--danger);transform:translate(-50%,-50%);box-shadow:0 0 0 2px white}.ripple .ring{position:absolute;border:4px solid var(--danger);border-radius:50%;transform:translate(-50%,-50%);animation:ring 2.5s ease-out infinite}.ripple .r2{animation-delay:.65s}.ripple .r3{animation-delay:1.3s}@keyframes ring{0%{width:0;height:0;opacity:.9;border-width:5px}75%{opacity:.18}100%{width:260px;height:260px;opacity:0;border-width:1px}}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:white;padding:9px 13px;border-radius:8px;box-shadow:var(--shadow);display:none;z-index:40;font-size:13px}.toast.show{display:block}.toast.error{background:var(--danger)}
footer{z-index:50;background:var(--ink);color:#aeb7c6;border-top:1px solid rgba(255,255,255,.1);padding:7px 14px;font-size:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}footer b{color:var(--gold)}footer .credit{margin-left:auto}footer a{color:var(--gold);text-decoration:none}
@media(max-width:760px){.controls{grid-template-columns:1fr auto}.search-wrap{grid-column:1/-1;grid-row:2}.brand small{display:none}.segment button{padding:0 10px}.stage{padding:12px}.map-card{width:100%}.map-head{flex-direction:column}.tech{gap:8px}.credit{margin-left:0!important;width:100%;text-align:center}}
@media(prefers-reduced-motion:reduce){.ring{animation:none!important;display:none}.focus-anchor{scroll-behavior:auto}}

/* ---- popups (ad + level select) ---- */
.popup-overlay{position:fixed;inset:0;background:rgba(10,14,24,.72);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.popup-overlay.hidden{display:none}
.popup-box{background:var(--paper2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:520px;width:100%;overflow:hidden}
.popup-ad img{display:block;width:100%;height:auto}
.popup-level{padding:26px 22px;text-align:center}
.popup-level h3{font:700 20px 'Spectral',serif;margin:0 0 16px;color:#28251e}
.popup-level .lvl-btns{display:flex;gap:12px;justify-content:center}
.popup-level button{flex:1;max-width:160px;height:48px;border:1px solid var(--line);background:var(--ink);color:#f2e9cf;font-weight:800;border-radius:9px;cursor:pointer;font-size:15px}
.popup-level button:hover{background:var(--gold);color:#241c05}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><strong>Eduhelp SMART MAP</strong><small>Historical &amp; Archaeological Places</small></div>
  <div class="controls">
    <div class="segment" aria-label="Syllabus level">
      <button type="button" data-level="OL" class="active">O/L</button>
      <button type="button" data-level="AL">A/L</button>
    </div>
    <div class="search-wrap">
      <input id="searchInput" class="search-box" autocomplete="off" placeholder="Search Sinhala / English / Tamil / Singlish" aria-autocomplete="list" aria-controls="suggestions">
      <button id="clearBtn" class="clear-btn" type="button" aria-label="Clear">×</button>
      <div id="suggestions" class="suggestions" role="listbox"></div>
    </div>
    <div class="segment" aria-label="Map language">
      <button type="button" data-lang="sin" class="active">S</button>
      <button type="button" data-lang="tml">T</button>
      <button type="button" data-lang="eng">E</button>
    </div>
  </div>
</header>
<main id="main"><div id="stage" class="stage"></div><div id="toast" class="toast"></div></main>
<footer>
  <span>Level: <b id="stLevel">O/L</b></span><span>Map: <b id="stMap">—</b></span><span>Language: <b id="stLang">Sinhala</b></span><span>File: <b id="stFile">—</b></span>
  <span class="credit"><a href="https://www.eduhelp.lk" target="_blank" rel="noopener">www.eduhelp.lk</a> — Amila Udawattha</span>
</footer>
</div>

<div id="adPopup" class="popup-overlay">
  <div class="popup-box popup-ad">
    <img src="https://raw.githubusercontent.com/Amilaeduhelp/smart-map/main/Eduhelp%20CVR-01.jpg" alt="Eduhelp Advertisement">
  </div>
</div>

<div id="levelPopup" class="popup-overlay hidden">
  <div class="popup-box popup-level">
    <h3>Syllabus Level එක තෝරන්න</h3>
    <div class="lvl-btns">
      <button type="button" data-popup-level="OL">O/L</button>
      <button type="button" data-popup-level="AL">A/L</button>
    </div>
  </div>
</div>

<script>

   CONFIGURATION
   ================================================================ */

const state={level:"OL",language:"sin",place:null};
const SEARCH_FIELDS=["si","en","ta","singlish"];
const $=s=>document.querySelector(s);
const els={stage:$("#stage"),main:$("#main"),search:$("#searchInput"),suggestions:$("#suggestions"),clear:$("#clearBtn"),toast:$("#toast"),stLevel:$("#stLevel"),stMap:$("#stMap"),stLang:$("#stLang"),stFile:$("#stFile")};
let suggestionItems=[],activeIndex=-1;

function normalize(v){return (v??"").toString().trim().toLowerCase().normalize("NFKC")}
function activePlaces(){return DATASETS[state.level] || []}
function matchScore(query,place){
  const q=normalize(query); let best=0;
  for(const f of SEARCH_FIELDS){const v=normalize(place.names[f]); if(!v)continue; if(v===q)best=Math.max(best,3); else if(v.startsWith(q))best=Math.max(best,2); else if(v.includes(q))best=Math.max(best,1)}
  return best;
}
function searchPlaces(query,limit=12){
  const q=normalize(query); if(!q)return [];
  return activePlaces().map(place=>({place,score:matchScore(q,place)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.place.names.en.localeCompare(b.place.names.en)).slice(0,limit).map(x=>x.place);
}
function exactPlace(query){const q=normalize(query);return activePlaces().find(p=>SEARCH_FIELDS.some(f=>normalize(p.names[f])===q))||null}
function mapFilename(place){const pre=LANGUAGE_PREFIX[state.language],lvl=state.level.toLowerCase(),grp=MAP_GROUP_CODE[place.mapGroup],n=Number.isInteger(place.mapVariant)&&place.mapVariant>0?place.mapVariant:"";return `${pre}_${lvl}_${grp}${n}.jpg`}
function mapUrl(place){return MAP_BASE_URL+mapFilename(place)}
function updateStatus(){els.stLevel.textContent=LEVEL_LABEL[state.level];els.stLang.textContent=LANGUAGE_LABEL[state.language];els.stMap.textContent=state.place?GROUP_LABEL[state.place.mapGroup]:"—";els.stFile.textContent=state.place?mapFilename(state.place):"—"}
function updateClear(){els.clear.classList.toggle("show",!!els.search.value)}
function closeSuggestions(){els.suggestions.classList.remove("open");suggestionItems=[];activeIndex=-1}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function renderSuggestions(items){
  suggestionItems=items;activeIndex=-1;
  if(!els.search.value.trim()){closeSuggestions();return}
  if(!items.length){els.suggestions.innerHTML=`<div class="empty-sugg">මෙම ${LEVEL_LABEL[state.level]} නාමාවලියේ ස්ථානයක් හමු නොවීය.</div>`;els.suggestions.classList.add("open");return}
  els.suggestions.innerHTML=items.map((p,i)=>`<div class="suggestion" role="option" data-i="${i}"><span class="swatch" style="background:${p.color}"></span><div><div class="sugg-main">${escapeHtml(p.names.en)}</div><div class="sugg-alt">${escapeHtml(p.names.si)} · ${escapeHtml(p.names.ta)} · ${escapeHtml(p.names.singlish)}</div></div><span class="tag">${LEVEL_LABEL[state.level]} · ${GROUP_LABEL[p.mapGroup]}</span></div>`).join("");
  els.suggestions.classList.add("open");
}
function renderWelcome(){
  const maps=state.level==="OL"?"ශ්‍රී ලංකා + ලෝක":"ශ්‍රී ලංකා + ඉන්දියා + යුරෝපා";
  els.stage.innerHTML=`<div class="welcome"><span class="level-pill">${LEVEL_LABEL[state.level]} · ${maps}</span><h2>ස්ථානයක් සොයන්න</h2><p>සිංහල, English, Tamil හෝ Singlish නමක් type කරන්න. Search results තුළ පෙන්වන්නේ දැනට තෝරා ඇති <b>${LEVEL_LABEL[state.level]}</b> නාමාවලියේ ස්ථාන පමණි.</p></div>`;
  updateStatus();
}
function renderPlace(){
  const p=state.place;if(!p){renderWelcome();return}
  const bounds=MAP_REGIONS[p.mapGroup]?.[p.region];
  const masks=bounds?`<div class="mask" style="top:0;height:${bounds[0]}%"></div><div class="mask" style="top:${bounds[1]}%;height:${100-bounds[1]}%"></div><div class="focus-anchor" style="top:${bounds[0]}%;height:${bounds[1]-bounds[0]}%"></div>`:"";
  const file=mapFilename(p),url=mapUrl(p);
  els.stage.innerHTML=`<article class="map-card"><div class="map-head"><div><div class="place-en">${escapeHtml(p.names.si)} · ${escapeHtml(p.names.ta)} · ${escapeHtml(p.names.en)}</div><div class="place-alt">${escapeHtml(p.names.singlish)}</div></div><span class="badge" style="background:${p.color};${p.color.toLowerCase()==='#ffffff'?'color:#222;border:1px solid #aaa':''}">${escapeHtml(p.category)}</span></div><div class="map-viewport" id="mapViewport"><div class="map-wrap"><img class="map-image" src="${url}" alt="${escapeHtml(p.names.en)} map"><div class="fallback" hidden>Map image <b>${file}</b> load වුණේ නැහැ. GitHub repository එකේ filename එක පරීක්ෂා කරන්න.</div>${masks}<div class="map-label">${LEVEL_LABEL[state.level]} · ${GROUP_LABEL[p.mapGroup]}<br>${escapeHtml(p.region)} · click map to mark</div></div></div><div class="tech"><span>Map: <b>${GROUP_LABEL[p.mapGroup]}</b></span><span>Region: <b>${escapeHtml(p.region)}</b></span><span>Variant: <b>${p.mapVariant}</b></span><span>File: <b>${file}</b></span></div></article>`;
  const img=els.stage.querySelector(".map-image");
  img.addEventListener("error",()=>{img.style.display="none";els.stage.querySelector(".fallback").hidden=false;showToast(`Could not load ${file}`,true)});
  img.addEventListener("load",focusRegion,{once:true});if(img.complete)focusRegion();updateStatus();
}
function focusRegion(){const a=els.stage.querySelector(".focus-anchor");if(a)requestAnimationFrame(()=>a.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center',inline:'center'}))}
function selectPlace(p){state.place=p;els.search.value=p.names.en;updateClear();closeSuggestions();renderPlace()}
function resetForLevel(level){
  state.level=level;state.place=null;els.search.value="";updateClear();closeSuggestions();
  document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===level));renderWelcome();els.search.focus();
}
function setLanguage(lang){state.language=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));state.place?renderPlace():updateStatus()}
function showToast(msg,error=false){els.toast.textContent=msg;els.toast.classList.toggle('error',error);els.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>els.toast.classList.remove('show'),2600)}
function spawnRipple(viewport,x,y){viewport.querySelector('.ripple')?.remove();const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';r.innerHTML='<span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>';viewport.appendChild(r)}

els.search.addEventListener('input',()=>{updateClear();renderSuggestions(searchPlaces(els.search.value))});
els.search.addEventListener('keydown',e=>{
  const open=els.suggestions.classList.contains('open');
  if(e.key==='ArrowDown'&&open&&suggestionItems.length){e.preventDefault();activeIndex=(activeIndex+1)%suggestionItems.length;paintActive()}
  else if(e.key==='ArrowUp'&&open&&suggestionItems.length){e.preventDefault();activeIndex=(activeIndex-1+suggestionItems.length)%suggestionItems.length;paintActive()}
  else if(e.key==='Enter'){e.preventDefault();const p=(activeIndex>=0?suggestionItems[activeIndex]:null)||exactPlace(els.search.value)||searchPlaces(els.search.value,1)[0];p?selectPlace(p):showToast(`No ${LEVEL_LABEL[state.level]} place found`,true)}
  else if(e.key==='Escape')closeSuggestions();
});
function paintActive(){els.suggestions.querySelectorAll('.suggestion').forEach((el,i)=>el.classList.toggle('active',i===activeIndex))}
els.suggestions.addEventListener('mousedown',e=>{const row=e.target.closest('.suggestion');if(row)selectPlace(suggestionItems[Number(row.dataset.i)])});
els.clear.addEventListener('click',()=>{els.search.value='';updateClear();closeSuggestions();state.place=null;renderWelcome();els.search.focus()});
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>resetForLevel(b.dataset.level)));
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))closeSuggestions()});
els.main.addEventListener('click',e=>{const v=e.target.closest('.map-viewport');if(!v)return;const r=v.getBoundingClientRect();spawnRipple(v,e.clientX-r.left,e.clientY-r.top)});
renderWelcome();

/* ================================================================
   POPUPS: 1) Ad popup (auto-closes after 2s) 2) Level-select popup
   Header O/L・A/L toggle buttons keep working exactly as before.
   ================================================================ */
const adPopup=$("#adPopup"), levelPopup=$("#levelPopup");
setTimeout(()=>{
  adPopup.classList.add('hidden');
  levelPopup.classList.remove('hidden');
},3000);
document.querySelectorAll('[data-popup-level]').forEach(b=>b.addEventListener('click',()=>{
  resetForLevel(b.dataset.popupLevel);
  levelPopup.classList.add('hidden');
}));
</script>
</body>
</html>
